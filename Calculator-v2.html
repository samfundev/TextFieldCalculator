<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1">
		<link rel="icon" href="favicon.ico">
		<title>Text-Field Calculator</title>
		<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
		<link rel="stylesheet" href="main.css">
		<script src="https://unpkg.com/mathjs@13.0.0/lib/browser/math.js"></script>
		<script type="module" src="date.js"></script>
		<script type="module" src="locked.js"></script>
		<style>
			html, body, .content {
				height: 100%;
			}

			body {
				margin: 0;
				font-size: 32px;
			}

			.content {
				display: grid;
				grid-template-rows: auto auto 1fr auto;
			}

			#container {
				overflow: hidden;
			}

			header, footer {
				margin: 10px;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background-color: #1e1e1e !important;
				}
			}

			.flex {
				display: flex;
				align-items: center;
			}

			.tabs-container {
				border-top: darkgray 1px solid;
				width: 100%;
				background-color: #181818;
				overflow-x: auto;
				margin-bottom: 6px;
			}

			.tabs > div {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px;
				border: 1px solid darkgray;
				border-top: none;
				border-left-width: 0;
				font-size: 24px;
				line-height: 1;
				user-select: none;
				text-wrap: nowrap;

				&.active {
					border-bottom-color: transparent;
					background-color: #1e1e1e;
				}

				&:not(.active):hover {
					background-color: rgba(255, 255, 255, 0.05);
				}
			}

			button {
				background: none;
				color: unset;
				border: none;
				font-weight: bold;
				border-radius: 6px;
				padding: 4px 3px;
				line-height: 0;

				&:hover {
					background-color: rgba(255, 255, 255, 0.5);
				}
			}

			.filler {
				flex: 1;
				border-bottom: darkgray 1px solid;
				padding-left: 6px;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div class="content">
			<header>
				<b>Text-Field Calculator</b>
				<a href="Calculator.html">Version 1</a>
			</header>
			<div class="flex tabs-container">
				<div class="tabs flex">
				</div>
				<div class="flex filler">
					<button class="new-tab">
						<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M8 1.5C8 1.22386 7.77614 1 7.5 1C7.22386 1 7 1.22386 7 1.5V7H1.5C1.22386 7 1 7.22386 1 7.5C1 7.77614 1.22386 8 1.5 8H7V13.5C7 13.7761 7.22386 14 7.5 14C7.77614 14 8 13.7761 8 13.5V8H13.5C13.7761 8 14 7.77614 14 7.5C14 7.22386 13.7761 7 13.5 7H8V1.5Z"/></svg>
					</button>
				</div>
			</div>
			<div id="container"></div>

			<footer>
				<a href="documentation">Documentation</a>
				<a href="https://github.com/samfundev/TextFieldCalculator">Source</a>
			</footer>
		</div>

		<script type="module" src="v2.js"></script>

		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
		<script src="changelog.js"></script>
	</body>
</html>
